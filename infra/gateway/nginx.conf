worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off; # no filtrar la versión de nginx

  # Rate limiting centralizado en la única puerta de entrada.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  # Login mucho más estricto: superficie de fuerza bruta.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  upstream transactions {
    server transactions:8000;
  }

  upstream auth {
    server auth:8000;
  }

  server {
    listen 8080;

    # SPA horneado en la imagen edge (k8s). En dev el gateway no tiene estáticos:
    # `ng serve` sirve el SPA en :4200 y solo proxea /api hacia aquí.
    root /usr/share/nginx/html;
    index index.html;

    # Mismo origen: el SPA es dueño de las rutas de cliente (/transactions, /activity,
    # /dashboard…) y el API cuelga de /api, que se reescribe a los paths reales del
    # contrato antes de proxear. Sin esta separación, navegar /transactions
    # devolvería el JSON del API en vez del SPA. Sin CORS: todo es mismo origen.

    # El 429 cumple el contrato (esquema Error + Retry-After), no la página HTML de
    # nginx. Retry-After estático: la zona más estricta (login, 10r/m) libera ~6s.
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 10 always;
      return 429 '{"code":"RATE_LIMITED","message":"Límite de solicitudes excedido."}';
    }

    # Login: rate-limit agresivo. Exacto, gana sobre los prefijos de abajo.
    location = /api/auth/login {
      rewrite ^/api/(.*)$ /$1 break;
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /api/auth/ {
      rewrite ^/api/(.*)$ /$1 break;
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://transactions;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # SPA: cualquier otra ruta sirve index.html (routing del lado del cliente).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
